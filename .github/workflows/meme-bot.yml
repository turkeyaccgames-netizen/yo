name: meme-bot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
    inputs:
      trends:
        description: "Send the trend digest now"
        type: boolean
        default: false

permissions:
  contents: write   # to commit state.json back to the repo

concurrency:
  group: meme-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          # ffmpeg joins YouTube's separate video and audio streams before upload.
          ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg
          pip install -U -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # Instagram's mirrors block datacenter IPs, so Instagram — and the combos, which should be
        # able to use Instagram clips — run on the owner's PC instead.
        run: python main.py --skip instagram --no-combos ${{ inputs.trends && '--trends' || '' }}

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "meme-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update bot state"
          # main may have moved on (a new commit, or an overlapping run), so rebase before pushing.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning::could not push state.json; the next run will send these posts again"
