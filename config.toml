# تنظیمات ربات میم
# هر اکانتی رو خواستی اضافه یا حذف کن. اکانت جدید دفعه‌ی اول فقط «دیده‌شده» ثبت میشه
# تا پست‌های قدیمیش یکجا برات فرستاده نشه.

[settings]
# حداکثر تعداد پست جدیدی که از هر اکانت در هر اجرا فرستاده میشه
max_new_per_account = 3
# پست‌هایی قدیمی‌تر از این (ساعت) به عنوان «پست جدید» فرستاده نمیشن (مثلاً پست پین‌شده)
max_post_age_hours = 48
# هر چند ساعت یکبار گزارش ترند فرستاده بشه
trends_every_hours = 3

