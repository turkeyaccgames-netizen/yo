[x]
# هر توییت تازه جدا فرستاده نشه (اکانت‌های X خیلی پرپست‌اند).
# توییت‌ها فقط در گزارش ترند و در ترکیب‌های پیشنهادی استفاده میشن.
# اگر می‌خوای هر توییت جدید هم بیاد، این رو true کن.
new_posts = false
# توییت‌های پربازدید این اکانت‌ها در بخش ترند X فرستاده میشن
