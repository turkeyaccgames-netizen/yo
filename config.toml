]

[telegram]
# کانال‌های عمومی تلگرام (فارسی). فقط اسم کانال، بدون @. کانال خصوصی خوانده نمی‌شود.
# این سه تا فقط برای شروع‌اند؛ کانال‌های میم و فان مورد علاقه‌ی خودت را جایشان بگذار.
# اگر این بخش را نمی‌خواهی، فهرست را خالی کن: accounts = []
accounts = [
    "gizmiztel",
    "funhiphop",
    "kafiha",
]

[trends]
# بازه‌ی زمانی برای پیدا کردن پست‌های پربازدید (ساعت)
window_hours = 24
# تعداد آیتم از هر پلتفرم در هر گزارش ترند
top_n = 5
# فقط وقتی YOUTUBE_API_KEY تنظیم شده باشه استفاده میشه
youtube_query = "memes|funny"
youtube_region = "US"
# منطقه‌ی فید ترند تیک‌تاک
tiktok_region = "US"
# تعداد موضوع ترند X
x_topics = 10

[combos]
# ترکیب‌های آماده: یک متن خنده‌دار + یک کلیپ که بشه روی هم گذاشت و منتشر کرد
enabled = true
# هر چند ساعت یکبار
every_hours = 3
# فقط ترکیب‌هایی که هر دو طرفش خنده‌دار باشن فرستاده بشن
funny_only = true
# چند تا جفت «متن + کلیپ» در هر بار
pairs_per_run = 10
# از هر اکانت حداکثر چند کلیپ در یک نوبت
max_per_author = 2
# چند تا بسته‌ی هم‌موضوع در هر بار
packs_per_run = 1
# پست‌های چند ساعت اخیر برای ترکیب در نظر گرفته بشن
window_hours = 48
# حداکثر حجم ویدیویی که در تلگرام فرستاده میشه (مگابایت، سقف تلگرام ۵۰)
max_video_mb = 45
# متن روی خود کلیپ نوشته بشه و میم آماده‌ی انتشار بیاد؟ (false = کلیپ خام، برای وقتی که خودت تدوین می‌کنی)
render_meme = true
# کلیپ ترکیب‌ها از کدام پلتفرم‌ها برداشته بشه. برای کلیپ کانال‌های تلگرام فارسی، "telegram" را هم اضافه کن
# (بهتر است فقط وقتی که هوش مصنوعی روشن است، چون متن‌های آماده انگلیسی‌اند)
clip_platforms = ["tiktok", "instagram", "youtube"]
# حداقل کیفیت متن برای اینکه به درد کپشن بخوره
min_caption_quality = 2.5
# کلیپ حداقل این تعداد بازدید (یا لایک) داشته باشه
min_video_views = 5000
# اگر متن توییت و کپشن کلیپ خیلی شبیه هم باشن یعنی یک پست تکراری‌ان
max_text_similarity = 0.4
# بسته‌ی هم‌موضوع: حداقل چند پست (از اکانت‌های مختلف)، از حداقل چند پلتفرم، و حداکثر چند تا در پیام.
# با ده اکانت در هر پلتفرم، سه پستِ هم‌موضوع تقریباً هیچ‌وقت پیدا نمی‌شد؛ برای همین حداقل دو است
pack_min_items = 2
pack_min_platforms = 2
pack_max_items = 4
pack_min_weight = 3.0

[ai]
# انتخاب هوشمند ترکیب‌ها با Claude: تصویر کلیپ را می‌بیند، متن مناسب را انتخاب می‌کند یا خودش می‌نویسد،
# و متن را به زبان خودت می‌دهد. فقط وقتی کار می‌کند که ANTHROPIC_API_KEY در فایل .env باشد؛
# بدون کلید، ربات مثل قبل با روش کلمه‌ای کار می‌کند.
enabled = true
# مدل. claude-haiku-5-5 ارزان‌ترین است (هر نوبت کمتر از یک سنت). برای کیفیت بالاتر: claude-sonnet-5-5 یا claude-opus-5-5
model = "claude-haiku-5-5"
# زبان متنی که روی کلیپ می‌آید: fa فارسی، en انگلیسی، ar عربی، tr ترکی
caption_language = "fa"
# ترکیب‌هایی که مدل از ۱۰ کمتر از این نمره بدهد فرستاده نمی‌شوند
min_score = 6
# حداکثر تعداد کلیپ، تصویر و متنی که در هر نوبت برای مدل فرستاده می‌شود (بیشتر = گران‌تر)
max_clips = 14
max_images = 14
max_lines = 30

[filters]
# در گزارش ترند، پست‌های خنده‌دار و باحال اول بیان
funny_first = true
# پست‌های خبری و ناراحت‌کننده اصلاً فرستاده نشن (هم در پست‌های جدید، هم در ترندها)
skip_serious = true

# نشانه‌های روشنِ پست خنده‌دار یا باحال (یکی کافی است)
funny_keywords = [
